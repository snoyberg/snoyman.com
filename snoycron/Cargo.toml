[package]
name = "snoycron"
version = "0.1.0"
authors = ["Michael Snoyman <michael@snoyman.com>"]
edition = "2021"

[dependencies]
reqwest = { version = "0.12.28", features = ["blocking", "rustls-tls", "json", "http2"], default-features = false }
anyhow = "1.0.103"
serde = { version = "1.0.142", features = ["derive"] }
serde_yaml = "0.9.4"
chrono = { version = "0.4.45", features = ["serde"] }
once_cell = "1.13.0"
